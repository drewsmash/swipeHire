{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="hero">
  <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="56" height="56">
  <h1>Create your account</h1>
</div>
<div class="segmented">
  <a href="{{ url_for('auth.signup', role='seeker') }}" class="{{ 'on' if role == 'seeker' }}">Job seeker</a>
  <a href="{{ url_for('auth.signup', role='employer') }}" class="{{ 'on' if role == 'employer' }}">Employer</a>
</div>
<form method="post" class="panel form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="role" value="{{ role }}">
  <label>{{ 'Full name' if role == 'seeker' else 'Company name' }}
    <input name="name" required maxlength="120" value="{{ request.form.name }}"></label>
  <label>Email <input type="email" name="email" required autocomplete="username" value="{{ request.form.email }}"></label>
  <label>Password <input type="password" name="password" required minlength="8" autocomplete="new-password">
    <small class="muted">At least 8 characters.</small></label>
  <button class="btn primary" type="submit">Create account</button>
</form>
<p class="center muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
